<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdba74"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#f97316"/>

  <!-- All content scaled to 75% and centered for mobile safe area -->
  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)">
    <!-- Letter A block - top left -->
    <g filter="url(#shadow)">
      <rect x="70" y="70" width="140" height="170" rx="18" fill="white"/>
      <text x="140" y="185" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="110" font-weight="bold" fill="#6366f1" text-anchor="middle">A</text>
    </g>

    <!-- Cute cat face - top right -->
    <g filter="url(#shadow)" transform="translate(270, 55)">
      <!-- Cat head -->
      <circle cx="90" cy="95" r="75" fill="white"/>
      <!-- Ears -->
      <path d="M35 50 L52 88 L68 52 Z" fill="white"/>
      <path d="M112 52 L128 88 L145 50 Z" fill="white"/>
      <path d="M40 55 L52 82 L62 58 Z" fill="#ffb6c1"/>
      <path d="M118 58 L128 82 L140 55 Z" fill="#ffb6c1"/>
      <!-- Eyes -->
      <circle cx="60" cy="90" r="11" fill="#1e293b"/>
      <circle cx="120" cy="90" r="11" fill="#1e293b"/>
      <circle cx="63" cy="87" r="3" fill="white"/>
      <circle cx="123" cy="87" r="3" fill="white"/>
      <!-- Nose -->
      <ellipse cx="90" cy="112" rx="7" ry="5" fill="#ffb6c1"/>
      <!-- Mouth -->
      <path d="M90 117 Q82 128 72 120" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M90 117 Q98 128 108 120" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Whiskers -->
      <line x1="28" y1="100" x2="52" y2="105" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <line x1="28" y1="115" x2="52" y2="115" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <line x1="128" y1="105" x2="152" y2="100" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <line x1="128" y1="115" x2="152" y2="115" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Cute bird - bottom left -->
    <g filter="url(#shadow)" transform="translate(55, 270)">
      <!-- Bird body -->
      <ellipse cx="75" cy="95" rx="65" ry="50" fill="#38bdf8"/>
      <!-- Wing -->
      <ellipse cx="75" cy="100" rx="40" ry="32" fill="#0ea5e9"/>
      <!-- Head -->
      <circle cx="120" cy="68" r="36" fill="white"/>
      <!-- Eye -->
      <circle cx="130" cy="63" r="9" fill="#1e293b"/>
      <circle cx="132" cy="61" r="3" fill="white"/>
      <!-- Beak -->
      <path d="M152 72 L175 68 L152 82 Z" fill="#fbbf24"/>
      <!-- Crest/tuft -->
      <ellipse cx="105" cy="38" rx="7" ry="13" fill="#ef4444" transform="rotate(-20, 105, 38)"/>
      <!-- Legs -->
      <rect x="58" y="140" width="5" height="25" rx="2" fill="#fbbf24"/>
      <rect x="92" y="140" width="5" height="25" rx="2" fill="#fbbf24"/>
      <!-- Feet -->
      <ellipse cx="60" cy="167" rx="10" ry="5" fill="#fbbf24"/>
      <ellipse cx="95" cy="167" rx="10" ry="5" fill="#fbbf24"/>
    </g>

    <!-- Shapes - bottom right -->
    <g filter="url(#shadow)">
      <!-- Star -->
      <path d="M390 310 L403 350 L448 350 L412 378 L425 420 L390 394 L355 420 L368 378 L332 350 L377 350 Z" fill="#fbbf24"/>
    </g>
    <g filter="url(#shadow)">
      <!-- Small circle -->
      <circle cx="405" cy="280" r="32" fill="#3b82f6"/>
    </g>
  </g>
</svg>
