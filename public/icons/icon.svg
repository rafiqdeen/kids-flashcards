<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pip the bird">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ccbf7"/>
      <stop offset="1" stop-color="#8ad7fb"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="40%" cy="34%" r="72%">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="55%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>
  </defs>

  <!-- world tile -->
  <rect width="512" height="512" rx="116" fill="url(#sky)"/>
  <!-- sun glow (top-right) -->
  <circle cx="430" cy="96" r="150" fill="url(#sun)"/>
  <!-- soft cloud -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="120" cy="150" rx="46" ry="20"/>
    <ellipse cx="150" cy="135" rx="30" ry="18"/>
  </g>
  <!-- rolling grass hills (the journey ground) -->
  <path d="M0 372 Q150 322 280 366 T512 352 V512 H0 Z" fill="#7ed957"/>
  <path d="M0 418 Q170 384 330 416 T512 406 V512 H0 Z" fill="#5cb83a"/>

  <!-- Pip -->
  <g>
    <!-- grounding shadow -->
    <ellipse cx="256" cy="430" rx="120" ry="26" fill="#1f3d12" opacity="0.18"/>
    <!-- feet -->
    <g stroke="#b45309" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M214 408 v24 M196 432 h44"/>
      <path d="M298 408 v24 M280 432 h44"/>
    </g>
    <!-- head tuft -->
    <path d="M256 96 q-26 -44 14 -46 q-12 30 22 44 Z" fill="#f97316" stroke="#b45309" stroke-width="9" stroke-linejoin="round"/>
    <!-- body -->
    <circle cx="256" cy="262" r="150" fill="url(#body)" stroke="#b45309" stroke-width="13"/>
    <!-- belly -->
    <ellipse cx="256" cy="296" rx="86" ry="94" fill="#fed7aa"/>
    <!-- cheeks -->
    <circle cx="158" cy="262" r="26" fill="#fb7185" opacity="0.6"/>
    <circle cx="354" cy="262" r="26" fill="#fb7185" opacity="0.6"/>
    <!-- eyes -->
    <circle cx="212" cy="236" r="34" fill="#ffffff"/>
    <circle cx="300" cy="236" r="34" fill="#ffffff"/>
    <circle cx="218" cy="244" r="17" fill="#2a1d12"/>
    <circle cx="306" cy="244" r="17" fill="#2a1d12"/>
    <circle cx="224" cy="237" r="6" fill="#ffffff"/>
    <circle cx="312" cy="237" r="6" fill="#ffffff"/>
    <!-- beak -->
    <path d="M232 282 l24 30 24 -30 q-24 -16 -48 0 Z" fill="#f59e0b" stroke="#b45309" stroke-width="6" stroke-linejoin="round"/>
    <!-- smile -->
    <path d="M224 322 q32 30 64 0" fill="none" stroke="#2a1d12" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffc83d">
    <path d="M86 232 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9 Z"/>
    <path d="M430 268 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 Z"/>
  </g>
</svg>
